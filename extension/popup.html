<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Meeting Action Items Recorder</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 320px;
      margin: 0;
      padding: 16px;
      background-color: #0f172a;
      color: #f8fafc;
      box-sizing: border-box;
    }
    h2 {
      font-size: 16px;
      margin: 0 0 12px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 11px;
      background: #3b82f6;
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .consent-banner {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 12px;
    }
    .consent-banner button {
      background: #3b82f6;
      border: none;
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      margin-top: 8px;
      cursor: pointer;
      font-size: 11px;
    }
    .status-box {
      background: #1e293b;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      margin-bottom: 14px;
      border: 1px solid #334155;
    }
    .indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #64748b;
      margin-right: 6px;
    }
    .recording .indicator {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.15); }
      100% { opacity: 1; transform: scale(1); }
    }
    .timer {
      font-size: 24px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      margin: 8px 0;
    }
    button.action-btn {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      transition: background 0.15s;
    }
    .start-btn {
      background: #22c55e;
      color: white;
    }
    .start-btn:hover { background: #16a34a; }
    .stop-btn {
      background: #ef4444;
      color: white;
    }
    .stop-btn:hover { background: #dc2626; }
    .auth-section {
      margin-top: 12px;
      font-size: 11px;
      color: #94a3b8;
    }
    input[type="text"] {
      width: 100%;
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid #334155;
      background: #0b1120;
      color: white;
      font-size: 11px;
      box-sizing: border-box;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h2>Meeting Recorder <span class="badge">v1.0</span></h2>

  <!-- One-time Consent Notice -->
  <div id="consentBanner" class="consent-banner" style="display: none;">
    <strong>Notice:</strong> Tab & mic audio will be recorded for transcription and action item extraction. Other meeting participants are <em>not notified automatically</em>. Please ensure you have appropriate consent.
    <br/>
    <button id="consentBtn">I Understand & Agree</button>
  </div>

  <div id="statusContainer" class="status-box">
    <div id="indicatorRow">
      <span class="indicator" id="recDot"></span>
      <span id="statusText">Ready to Record</span>
    </div>
    <div class="timer" id="timer">00:00</div>
  </div>

  <button id="startBtn" class="action-btn start-btn">Start Recording</button>
  <button id="stopBtn" class="action-btn stop-btn" style="display: none;">Stop Recording</button>

  <div class="auth-section">
    <label>Backend Auth Token / API Key:</label>
    <input type="text" id="tokenInput" placeholder="Enter JWT or auto-authenticated token" />
  </div>

  <script src="popup.js"></script>
</body>
</html>
